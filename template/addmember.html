<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Add new member</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
	<form class="add-member-form" action="/add" method="POST">
		<label for="name">Name</label>
		<input type="text" id="name" name="name">

		<label for="point">Point</label>
		<input type="number" id="point" name="point"> 

		<button class="add-member-btn-submit" type="submit">Add member</button>
		<a class="cancel-btn" href="/">Cancel</a>
	</form>
	
</main>
</body>
</html>
