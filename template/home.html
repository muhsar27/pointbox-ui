<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PointBox Members</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <form id="delete-member" action="delete" method="POST">
        <main>
        <a class="add-member-btn" href="/add">Add member</a>
        <table>
            <thead>
            <tr>
                <th></th>
                <th>ID</th>
                <th>Name</th>
                <th>Points</th>
                <th>Last Updated</th>
            </tr>
            </thead>
            <tbody>
            {{ range $ID, $Member := . }}
            <tr>
                <td><input type="checkbox" name="ID" value="{{$ID}}"></td>
                <td>{{$ID}}</td>
                <td>{{$Member.Name}}</td>
                <td>{{$Member.Points}}</td>
                <td>{{$Member.LastUpdated}}</td>
                <td>
                <form action="/add/points/{{$ID}}" method="POST">
                    <button class="add-point-btn">Add points</button>
                </form>
                </td>
                <td>
                <form action="/delete/points/{{$ID}}" method="POST">
                    <button class="delete-point-btn">Delete points</button>
                </form>
                </td>
            </tr>
            {{ end }}
            </tbody>
        </table>
        <input type="submit" for="delete-member" value="Delete Member(s)">
        </main>
    </form>
  </body>
</html>
